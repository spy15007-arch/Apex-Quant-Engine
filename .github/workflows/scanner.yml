name: Master Quant Scanner

on:
  schedule:
    # Morning Scan: 9:28 AM IST (Bypasses the 9:30 AM global queue)
    - cron: '58 3 * * 1-5'
    
    # Afternoon Scan: 2:43 PM IST (Bypasses the 2:45 PM global queue)
    - cron: '13 9 * * 1-5'
    
  # Keeps the manual trigger button active for you
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute Master Scanner Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python master_scanner.py
      
    - name: Save and Commit Results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scanner reports and alerts memory" && git push)
