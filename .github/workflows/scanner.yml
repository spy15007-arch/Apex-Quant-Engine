name: Master Quant Scanner

on:
  schedule:
    # Runs at 9:28 AM IST (03:58 UTC) Monday-Friday
    - cron: '58 3 * * 1-5'
    # Runs at 2:43 PM IST (09:13 UTC) Monday-Friday
    - cron: '13 9 * * 1-5'
  # Allows you to run this manually from the Actions tab
  workflow_dispatch: 

# Grants the workflow permission to push files back to your repo
permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy scipy requests streamlit plotly streamlit-lightweight-charts requests-cache requests-ratelimiter pyrate-limiter

    - name: Execute Master Scanner Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python master_scanner.py
        
    - name: Commit and push updated data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Force add all files
        git add -A
        
        # Print the exact file status to the logs
        git status
        
        # Commit (This will turn RED and fail if the file didn't actually change)
        git commit -m "Auto-update quant data"
        
        # Push (This will turn RED and fail if it is a permissions block)
        git push
