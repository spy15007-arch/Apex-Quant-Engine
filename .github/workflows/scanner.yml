name: Master Quant Scanner

on:
  schedule:
    # Runs at 9:28 AM IST (03:58 UTC) Monday-Friday
    - cron: '58 3 * * 1-5'
    # Runs at 2:43 PM IST (09:13 UTC) Monday-Friday
    - cron: '13 9 * * 1-5'
  # Allows you to run this manually from the Actions tab
  workflow_dispatch: 

# Grants the workflow permission to push files back to your repo
permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy scipy requests streamlit plotly streamlit-lightweight-charts

    - name: Execute Master Scanner Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python master_scanner.py
        
    - name: Commit and push updated data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 1. Force add the files to bypass any hidden .gitignore rules
        git add -f all_setups.csv index_setups.csv portfolio.csv chart_data.csv deep_dive_analysis.md sent_alerts.json || true
        
        # 2. Print status to the console so we can see what Git is doing
        git status
        
        # 3. Commit the changes
        git commit -m "Auto-update quant data" || echo "No changes to commit"
        
        # 4. Explicitly push using the auth token to bypass permission drops
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
