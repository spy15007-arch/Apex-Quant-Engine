name: Apex Quant Engine

on:
  schedule:
    # Automated run at 14:30 IST (09:00 UTC) Monday through Friday
    - cron: '0 9 * * 1-5'
  workflow_dispatch: 
    # This enables the manual "Run workflow" button in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy scipy requests

    - name: Run Institutional Quant Scanner
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python master_scanner.py

    - name: Commit and Push Updated Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "System: Update daily quant data and portfolio ledger" || true
        git pull --rebase origin main
        git push origin main
